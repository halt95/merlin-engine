<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Merlin 3.0.2.1</title>
<desc id="dsc">Open models at their full 262K context on consumer GPUs. A vLLM 0.33.0 fork tuned for Ampere and Ada  ·  one install  ·  one command Host RAM token embedding tables; 192 tok/s decode at 262K; 7,036 tok/s prefill; One command merlin serve &lt;checkpoint&gt;</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="0.55" stop-color="#121638"/><stop offset="1" stop-color="#1d1145"/></linearGradient>
<radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55"><stop offset="0" stop-color="#5b6cff" stop-opacity="0.38"/><stop offset="1" stop-color="#5b6cff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="0.08" cy="1.0" r="0.6"><stop offset="0" stop-color="#2fb3ff" stop-opacity="0.16"/><stop offset="1" stop-color="#2fb3ff" stop-opacity="0"/></radialGradient>
<linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<clipPath id="card"><rect width="1280" height="452" rx="18"/></clipPath>
</defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}</style>

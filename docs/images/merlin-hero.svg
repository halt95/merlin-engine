<path d="M992.0,86.0 L993.6,89.8 L997.7,90.1 L994.6,92.8 L995.5,96.9 L992.0,94.7 L988.5,96.9 L989.4,92.8 L986.3,90.1 L990.4,89.8 Z" fill="#ffffff" fill-opacity="0.4"/>
<path d="M1214.0,189.0 L1215.9,193.5 L1220.7,193.8 L1217.0,197.0 L1218.1,201.7 L1214.0,199.2 L1209.9,201.7 L1211.0,197.0 L1207.3,193.8 L1212.1,193.5 Z" fill="#ffffff" fill-opacity="0.35"/>

<text x="72" y="152" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Merlin</text>
<rect x="366.9" y="104" width="118.4" height="30" rx="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.45"/>
<text x="426.1" y="124" font-size="15" font-weight="600" fill="#d9ccff" text-anchor="middle">engine 3.0.2.1</text>
<text x="72" y="214" font-size="30" font-weight="600" fill="#eef1fb">Open models at their full 262K context on consumer GPUs.</text>
<text x="72" y="254" font-size="20" fill="#9aa4bf">A vLLM 0.33.0 fork tuned for Ampere and Ada  ·  one install  ·  one command</text>
<rect x="72.0" y="292" width="269.0" height="116" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
<text x="94.0" y="336" font-size="40.0" font-weight="700" fill="#ffffff">Host RAM</text>
<text x="94.0" y="366" font-size="17" font-weight="600" fill="#c9d1e6">token embedding tables</text>
<text x="94.0" y="388" font-size="12.5" fill="#8a93ad">Frees VRAM, no speed loss.</text>
<rect x="361.0" y="292" width="269.0" height="116" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
<text x="383.0" y="336" font-size="40.0" font-weight="700" fill="#ffffff">192 tok/s</text>
<text x="383.0" y="366" font-size="17" font-weight="600" fill="#c9d1e6">decode at 262K</text>
<text x="383.0" y="388" font-size="12.3" fill="#8a93ad">Flash-Next, one stream, 4× RTX 3090</text>
<rect x="650.0" y="292" width="269.0" height="116" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
<text x="672.0" y="336" font-size="38.5" font-weight="700" fill="#ffffff">7,036 tok/s</text>
<text x="672.0" y="366" font-size="17" font-weight="600" fill="#c9d1e6">prefill</text>
<text x="672.0" y="388" font-size="15.0" fill="#8a93ad">Flash-Next, 100K prompt, cold</text>
<rect x="939.0" y="292" width="269.0" height="116" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
<text x="961.0" y="336" font-size="32.7" font-weight="700" fill="#ffffff">One command</text>
<text x="961.0" y="366" font-size="17" font-weight="600" fill="#c9d1e6">merlin serve &lt;checkpoint&gt;</text>
<text x="961.0" y="388" font-size="15.0" fill="#8a93ad">picks the layout for your GPUs</text>

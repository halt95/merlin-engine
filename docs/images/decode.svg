<title id="ttl">Decode speed at 4K, 131K and the full 262K context</title>
<desc id="dsc">One stream, thinking on, median of 3 (ThinkingCap 2× at 262K: median of 12). Measured on Merlin 3.0.2.2 for the Qwen3.8-27B and ThinkingCap four-card rows and Ornith 1.5; the other rows are the 3.0.2.1 figures, carried forward after a 3.0.2.2 spot check. RTX 3090s at 220 W. Flash-Next 4× 3090 (3.0.2.1): 174 at 4K, 188 at 131K, 192 at 262K; Swift1.5 4× 3090 (3.0.2.1): 180 at 4K, 185 at 131K, 182 at 262K; Swift1.5-Huihui 4× 3090 (3.0.2.1): 178 at 4K, 190 at 131K, 203 at 262K; Qwen3.8-27B 1× 3090 (3.0.2.1): 131 at 4K, 102 at 131K, 75 at 262K; Qwen3.8-27B 2× 3090 (3.0.2.1): 248 at 4K, 197 at 131K, 160 at 262K; Qwen3.8-27B 4× 3090: 315 at 4K, 296 at 131K, 267 at 262K; ThinkingCap 2× 3090 (3.0.2.1): 244 at 4K, 179 at 131K, 163 at 262K; ThinkingCap 4× 3090: 287 at 4K, 277 at 131K, 274 at 262K; Nemotron 3.5 Super VL 4× 3090 (3.0.2.1): 105 at 4K, 102 at 131K, 101 at 262K; Ornith 1.5 4× 3090: 152 at 4K, 106 at 131K, 106 at 262K (tok/s).</desc>
